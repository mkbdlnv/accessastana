server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/geo+json image/svg+xml;

    # API: "/api/cities" -> "http://api:8000/cities".
    # The trailing slash in proxy_pass replaces the matched "/api/" prefix with "/".
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # scenario / optimisation requests may take a while
        proxy_read_timeout 300s;
    }

    # MapLibre's web worker is an ES module (.mjs); older mime.types files
    # do not map this extension, and browsers refuse module scripts served
    # with a wrong MIME type.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
