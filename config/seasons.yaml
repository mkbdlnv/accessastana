# Season (climate) profiles for walking accessibility.
#
# Every number here is a MODELLING ASSUMPTION. The source of each one is
# given next to it, and all are configurable. Accessibility is computed as
#   minutes = network_distance_m / speed_mps / 60
# and a facility counts as "reachable" when minutes <= max_minutes.
#
# --- Base speed --------------------------------------------------------------
# 1.33 m/s = 4.8 km/h is a conventional planning value (ASSUMPTION). Context
# from verified sources (docs/final/sources_verified.md):
# - Knoblauch, Pietrucha & Nitzburg (1996), Transportation Research Record 1538,
#   27-38, doi:10.1177/0361198196153800104: CROSSWALK speeds at 16 signalised
#   crossings; 15th-percentile 1.25 m/s (ages 14-64) and 0.97 m/s (65+);
#   recommended design values 1.22 and 0.91 m/s (abstract).
# - Fossum & Ryeng (2021), Table 3: mean 1.511 m/s on dry asphalt in Trondheim
#   (adult pedestrians on weekdays).
# 1.33 m/s lies between the conservative design value (1.22) and observed adult
# means (~1.5). Children and older people walk slower, so absolute minutes are
# indicative; comparisons between seasons and districts use the same speed.
#
# --- Winter speed reduction ---------------------------------------------------
# Fossum M., Ryeng E. O. (2021) "The walking speed of pedestrians on various
# pavement surface conditions during winter", Transportation Research Part D 97,
# 102934, doi:10.1016/j.trd.2021.102934, Table 3 (p. 11): model-predicted mean
# speeds on flat ground, N = 1,631, Trondheim, Nov 2019 - Mar 2020, -12...+8 C:
#   asphalt 1.511 | compact snow 1.403 | loose snow 1.378 | gritted ice 1.361 | ice 1.257 m/s
# Applied as RATIOS to the base speed (transferability assumption: Norwegian
# observations applied to Astana):
#   compact snow 1.403 / 1.511 = 0.9285  -> 1.33 * 0.9285 = 1.235 m/s
#   clean ice    1.257 / 1.511 = 0.8319  -> 1.33 * 0.8319 = 1.106 m/s
#
# --- Acceptable walking time in severe cold ------------------------------------
# Environment and Climate Change Canada, "Wind chill and the Wind Chill Index":
# wind chill -28 to -39 = "High risk ... Exposed skin can freeze in 10 to 30 minutes".
# https://www.canada.ca/en/services/environment/weather/severeweather/wind-chill-index.html
# ASSUMPTION (team, configurable): on such days the acceptable one-way trip
# drops from 15 to 10 minutes, the lower bound of that window. The report shows
# the sensitivity of the result for 8 / 10 / 12 minutes.
#
# --- Assigning days to profiles ----------------------------------------------
# The climate loader classifies every day of the reference period (Open-Meteo
# ERA5 reanalysis, 2015-2024) using the `day_rule` of each winter profile.
# Rules are evaluated top to bottom; the first match wins. The share of days
# per profile is stored in the DB and used to compute the "expected winter"
# accessibility (day-weighted mix of profiles). See analysis/climate.py.

reference_period: {start: "2015-01-01", end: "2024-12-31"}

profiles:
  summer:
    label: Summer
    months: [6, 7, 8]
    speed_mps: 1.33
    max_minutes: 15
  winter:
    label: Winter (typical)
    months: [12, 1, 2]
    speed_mps: 1.235      # 1.33 * 1.403/1.511 (compact snow, Fossum & Ryeng 2021)
    max_minutes: 15
    day_rule: {}          # fallback: any winter day not matched below
  winter_severe:
    label: Winter (severe cold)
    months: [12, 1, 2]
    speed_mps: 1.106      # 1.33 * 1.257/1.511 (clean ice, Fossum & Ryeng 2021)
    max_minutes: 10
    # Wind chill computed with the ECCC/NWS formula from the daily minimum
    # temperature and the daily mean 10 m wind speed (conservative: the cold
    # morning commute).
    day_rule: {wind_chill_max: -28}

# The UI and API expose these "seasons". `winter` is the typical winter day;
# `winter_severe` is the stress-test day.
api_seasons: [summer, winter, winter_severe]

# Thresholds used for population-share summaries (minutes).
summary_thresholds: [5, 10, 15]
