# Season (climate) profiles for walking accessibility.
#
# Every number here is a MODELLING ASSUMPTION. The source of each one is
# given next to it, and all are configurable. Accessibility is computed as
#   minutes = network_distance_m / speed_mps / 60
# and a facility counts as "reachable" when minutes <= max_minutes.
#
# --- Base speed --------------------------------------------------------------
# 1.33 m/s = 4.8 km/h: a conventional planning value for adult walking. It lies
# inside the 1.25-1.51 m/s range of mean free-flow walking speeds reported by
# Knoblauch, Pietrucha & Nitzburg (1996), "Field studies of pedestrian walking
# speed and start-up time", Transportation Research Record 1538, 27-38.
# We deliberately do NOT use 1.53 m/s (Fossum's asphalt mean, below): that
# sample was weekday commuters, faster than the general population that
# includes children and the elderly.
#
# --- Winter speed reduction ---------------------------------------------------
# Fossum M. (NTNU), "Pedestrians' walking behavior and single accidents during
# winter conditions", NTSA 2021 / Transportation Research Part D, 2021
# (doi:10.1016/j.trd.2021.102934). Naturalistic observation, N = 1,551 in Norway:
#   asphalt 1.53 m/s | compact snow 1.43 | loose snow 1.40 | gritted ice 1.38 | ice 1.27
# We apply these as RATIOS to our base speed (transferability assumption):
#   compact snow 1.43/1.53 = 0.935   ice 1.27/1.53 = 0.830
#
# --- Acceptable walking time in severe cold ------------------------------------
# Environment and Climate Change Canada wind-chill guidance: at a wind chill of
# -28 to -39, exposed skin can freeze in 10-30 minutes ("high risk").
# https://www.canada.ca/en/environment-climate-change/services/weather-health/wind-chill-cold-weather/wind-chill-index.html
# ASSUMPTION (team, configurable): on such days the acceptable one-way trip
# drops from 15 to 10 minutes, i.e. below the lower bound of the 10-30 min
# frostbite window.
#
# --- Assigning days to profiles ----------------------------------------------
# The climate loader classifies every day of the reference period (Open-Meteo
# ERA5 reanalysis, 2015-2024) using the `day_rule` of each winter profile.
# Rules are evaluated top to bottom; the first match wins. The share of days
# per profile is stored in the DB and used to compute the "expected winter"
# accessibility (day-weighted mix of profiles). See analysis/climate.py.

reference_period: {start: "2015-01-01", end: "2024-12-31"}

profiles:
  summer:
    label: Summer
    months: [6, 7, 8]
    speed_mps: 1.33
    max_minutes: 15
  winter:
    label: Winter (typical)
    months: [12, 1, 2]
    speed_mps: 1.244      # 1.33 * 0.935 (compact snow)
    max_minutes: 15
    day_rule: {}          # fallback: any winter day not matched below
  winter_severe:
    label: Winter (severe cold)
    months: [12, 1, 2]
    speed_mps: 1.104      # 1.33 * 0.830 (ice/hard conditions)
    max_minutes: 10
    # Wind chill computed with the ECCC/NWS formula from the daily minimum
    # temperature and the daily mean 10 m wind speed (conservative: the cold
    # morning commute).
    day_rule: {wind_chill_max: -28}

# The UI and API expose these "seasons". `winter` is the typical winter day;
# `winter_severe` is the stress-test day.
api_seasons: [summer, winter, winter_severe]

# Thresholds used for population-share summaries (minutes).
summary_thresholds: [5, 10, 15]
