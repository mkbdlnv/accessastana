# Production stack for ONE EC2 instance (see docs/deployment-aws.md).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Differences from the dev compose file:
# - Images are pulled from GHCR (built by .github/workflows/build.yml),
#   not built on the server.
# - The database port is NOT published; only nginx (frontend, port 80) is public.
# - restart policies, memory limits, log rotation.
# - No ingestion container: heavy preprocessing runs offline, and the
#   results arrive as a pg_dump (scripts/restore_db.sh).
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-accessastana}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-accessastana}"]
      interval: 10s
      retries: 10
    deploy: {resources: {limits: {memory: 1g}}}
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX, e.g. ghcr.io/org/repo}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ACCESSASTANA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-accessastana}
      ACCESSASTANA_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      ACCESSASTANA_LOG_LEVEL: INFO
    volumes:
      - reports:/app/reports
    depends_on: {db: {condition: service_healthy}}
    deploy: {resources: {limits: {memory: 1500m}}}
    logging: *logging

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api]
    deploy: {resources: {limits: {memory: 128m}}}
    logging: *logging

volumes:
  pgdata:
  reports:
