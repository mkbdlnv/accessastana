[project]
name = "accessastana"
version = "0.1.0"
description = "Climate-adjusted accessibility analysis of social infrastructure in Kazakhstan cities using open data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # --- core data / analysis ---
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "h3>=4.1",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "reportlab>=4.2",
    "httpx>=0.27",
    # --- db ---
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # --- api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "ortools>=9.15.6755",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
# Heavy, offline-only dependencies: needed to build data, NOT to serve the API.
ingest = ["osmium>=4.0", "osmnx>=2.0"]

[project.scripts]
accessastana = "accessastana.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessastana"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501", "N818", "N812"]  # Cyrillic text; FastAPI Depends(); line length is owned by `ruff format`; `S` alias for schemas

[tool.mypy]
python_version = "3.12"
files = ["src/accessastana/analysis", "src/accessastana/api"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostGIS database (TEST_DATABASE_URL)",
    "system: smoke test against a running deployment (ACCESSASTANA_SMOKE_URL)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["accessastana"]
